name: 构建 PCL 枪战突击修改版

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 准备 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原 NuGet 包
        run: msbuild "Plain Craft Launcher 2.sln" /t:Restore /p:Configuration=Release /verbosity:minimal

      - name: 编译（Release / Any CPU）
        run: msbuild "Plain Craft Launcher 2.sln" /p:Configuration=Release /p:Platform="Any CPU" /m /verbosity:minimal

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          # 可执行文件在 bin\Release（老式 vbproj）。以前只拷了 bin 根目录，
          # 结果一个文件都没收到 → 产物只剩几个 dll。
          $rel = "Plain Craft Launcher 2\bin\Release"
          if (-not (Test-Path $rel)) { $rel = "Plain Craft Launcher 2\bin" }
          Write-Host "可执行目录：$rel"
          Copy-Item "$rel\*" output\ -Recurse -Force -ErrorAction SilentlyContinue

          # ★ 关键：Resources 里是 PCL 运行时**动态加载**的第三方 DLL
          #   （Newtonsoft.Json / NAudio / Ookii.Dialogs.Wpf / Imazen.WebP / CacheCow …）
          #   还有字体 Font.ttf、主题 Custom.xaml。缺了它启动就退（exit code 4），
          #   窗口都出不来。以前没打包这一项，所以产物是"能编出来但打不开"的。
          if (Test-Path "Plain Craft Launcher 2\Resources") {
            Copy-Item "Plain Craft Launcher 2\Resources" output\ -Recurse -Force
          }

          Write-Host "产物清单："
          Get-ChildItem output -Recurse | Select-Object FullName, Length | Format-Table
          $exe = Get-ChildItem output -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "没找到 exe，编译可能失败了" }
          Write-Host "主程序：$($exe.FullName)"

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: PCL-QiangTuEdition
          path: output
          retention-days: 30
